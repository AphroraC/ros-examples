#! /usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()
gen.add("int_param",int_t,0,"Int Param",10,1,100);
gen.add("double_param",double_t,0,"Double Param",1.57,1,3.14);
gen.add("str_param",str_t,0,"Str Param","hello");
gen.add("bool_param",bool_t,0,"Bool Param",True);
myList = gen.enum([gen.const("small",int_t,0,"small car"),
                   gen.const("normal",int_t,1,"normal car"),
                   gen.const("big",int_t,2,"big car"),
                   ],"car_size");
gen.add("list_param",int_t,0,"List Param",0,0,2,edit_method=myList);

exit(gen.generate("dynamic_cfg_demo","dr_client","dr"));
